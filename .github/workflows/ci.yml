name: Lint & Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: shellcheck install.sh install-remote.sh package.sh tests/smoke_test.sh

  build:
    name: Build .plasmoid
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build package
        run: bash package.sh

      - name: Verify package exists
        run: ls -lh *.plasmoid

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run unit tests
        run: node tests/runner.js

      - name: Install Plasma SDK & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y plasma-sdk xvfb

      - name: Run plasmoidviewer smoke test
        run: bash tests/smoke_test.sh
